# Render Blueprint: 대시보드에서 "New > Blueprint" 로 이 저장소를 고르면 아래대로 서버가 만들어진다
services:
  - type: web
    name: thought-index-api
    runtime: docker
    plan: free
    region: singapore
    rootDir: backend # backend/ 아래가 바뀔 때만 다시 배포
    dockerfilePath: ./backend/Dockerfile # 저장소 루트 기준 경로
    dockerContext: ./backend
    healthCheckPath: /api/auth/providers
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: JWT_SECRET
        generateValue: true # Render 가 긴 무작위 값을 만들어 넣어준다
      - key: DB_URL
        sync: false # 대시보드에서 직접 입력 (Supabase 주소)
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: FRONTEND_URL
        sync: false # 예: https://thought-index.vercel.app
      - key: CORS_ALLOWED_ORIGINS
        sync: false # FRONTEND_URL 과 같은 값
      - key: SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_GOOGLE_CLIENT_ID
        sync: false
      - key: SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_GOOGLE_CLIENT_SECRET
        sync: false
