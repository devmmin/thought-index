# 모든 환경 공통 설정
spring:
  application:
    name: thought-index
  profiles:
    # 프로필을 따로 안 주면 local 로 뜬다. 운영은 SPRING_PROFILES_ACTIVE=prod
    default: local
  data:
    web:
      pageable:
        # ?size=100000 같은 요청으로 DB 를 괴롭히지 못하게
        max-page-size: 50
  jpa:
    # 스키마는 Flyway 가 만들고, Hibernate 는 엔티티와 맞는지 검사만 한다
    hibernate:
      ddl-auto: validate
    # 컨트롤러(뷰)까지 영속성 컨텍스트를 끌고 가지 않는다 → 지연로딩은 서비스 안에서 끝낸다
    open-in-view: false
    properties:
      hibernate:
        default_batch_fetch_size: 100

server:
  # Render 같은 호스팅은 포트를 PORT 환경변수로 정해준다
  port: ${PORT:8080}
  # 프록시(https) 뒤에서 돌 때 원래 주소를 알아야 구글 로그인 redirect 주소가 https 로 만들어진다
  forward-headers-strategy: framework

app:
  cors:
    allowed-origins: http://localhost:5190
  auth:
    token-ttl: 7d
    frontend-url: http://localhost:5190
