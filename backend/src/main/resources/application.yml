# 모든 환경 공통 설정
spring:
  application:
    name: thought-index
  profiles:
    # 프로필을 따로 안 주면 local 로 뜬다. 운영은 SPRING_PROFILES_ACTIVE=prod
    default: local
  data:
    web:
      pageable:
        # ?size=100000 같은 요청으로 DB 를 괴롭히지 못하게
        max-page-size: 50
  jpa:
    # 스키마는 Flyway 가 만들고, Hibernate 는 엔티티와 맞는지 검사만 한다
    hibernate:
      ddl-auto: validate
    # 컨트롤러(뷰)까지 영속성 컨텍스트를 끌고 가지 않는다 → 지연로딩은 서비스 안에서 끝낸다
    open-in-view: false
    properties:
      hibernate:
        default_batch_fetch_size: 100

app:
  cors:
    allowed-origins: http://localhost:5190
