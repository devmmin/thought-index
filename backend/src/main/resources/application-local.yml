# 로컬 개발: 파일형 H2 (서버 껐다 켜도 데이터 유지)
spring:
  datasource:
    url: jdbc:h2:file:./data/thought-index;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
    username: sa
    password:
  flyway:
    # 로컬에서만 예시 데이터(seed)를 넣는다. 운영 DB 에는 절대 안 들어감
    locations: classpath:db/migration,classpath:db/seed
  # 구글 로그인을 로컬에서 켜려면 아래 두 줄 주석을 풀고 값을 넣는다 (깃에 올리지 말 것 → 환경변수 권장)
  # security.oauth2.client.registration.google.client-id: ...
  # security.oauth2.client.registration.google.client-secret: ...
  h2:
    console:
      enabled: true
  jpa:
    properties:
      hibernate:
        format_sql: true

logging:
  level:
    org.hibernate.SQL: debug

app:
  auth:
    # 로컬 전용 서명 키. 운영은 JWT_SECRET 환경변수로 따로 넣는다
    jwt-secret: local-dev-only-secret-key-at-least-32-bytes!!
